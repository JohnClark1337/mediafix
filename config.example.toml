model = "small"
device = "cpu"
compute_type = "int8"
cpu_threads = 4
beam_size = 5
vad_filter = true

sub_language = "en"
translate = false
sidecar_ext = ".srt"

# Search for subtitles online (subliminal) when nothing is embedded or on disk.
subtitle_search = true
subliminal_providers = []
# Provider API keys, e.g. { opensubtitles.com = { username = "...", password = "..." } }
subliminal_provider_configs = {}

# Profanity censorship ("bleeparr").
# swears_path = "C:\\path\\to\\my-swears.txt"   # default: bundled cleanvid list
bleeptool = "S-M-FSM"
beep = false
beep_mode = ""
pre_buffer_ms = 100
post_buffer_ms = 100
boost_db = 6
censor_audio_langs = "eng,en,english,und"
censor_models = ["small.en", "medium.en"]
censor_track_title = "Censored (Bleeparr)"

downmix_jobs = 4
video_ext = [".mkv", ".mp4", ".avi", ".mov", ".m4v", ".webm", ".ts", ".m2ts"]
subtitle_ext = [".srt", ".ass", ".ssa", ".vtt", ".sub"]

ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
mkvmerge = "mkvmerge"

enhance = 1.5
voice = 2.0
bitrate = "192k"
loudness = -16.0
loudnorm = true
replace = false
remux = true

free_space_margin_gb = 2.0